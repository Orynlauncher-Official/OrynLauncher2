name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew Orynlauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Rename Release APK
        if: inputs.variant == 'Release'
        run: |
          mv Orynlauncher/build/outputs/apk/release/*.apk Orynlauncher/build/outputs/apk/release/OrynLauncherV5-Release.apk

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          # archive:false tek dosya yükler ve zip yapmaz.
          # Bu modda "name" parametresi dikkate alınmaz; artifact adı yüklenen dosyanın adı olur.
          name: OrynLauncherV5-Release.apk
          path: Orynlauncher/build/outputs/apk/release/OrynLauncherV5-Release.apk
          archive: false

      - name: Rename Debug APK
        if: inputs.variant == 'Debug'
        run: |
          mv Orynlauncher/build/outputs/apk/debug/*.apk Orynlauncher/build/outputs/apk/debug/OrynLauncherV5-Debug.apk

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: OrynLauncherV5-Debug.apk
          path: Orynlauncher/build/outputs/apk/debug/OrynLauncherV5-Debug.apk
          archive: false
